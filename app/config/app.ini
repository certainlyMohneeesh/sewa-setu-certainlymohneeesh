; Sewa Setu configuration
; Consolidated from config/settings.ini, March 2026 (CR-2026-031)
;
; Secrets are NOT stored here. They are read from environment variables
; (docker compose supplies them from the untracked .env file):
;   SEWASETU_DB_PASSWORD  database password
;   SECRET_KEY            Flask session-signing key (>= 32 random characters)
;   ADMIN_PASSWORD        admin password (or ADMIN_PASSWORD_HASH, a werkzeug hash)

[database]
host = db
port = 5432
name = sewasetu
user = sewasetu

[app]
sms_gateway_url = http://smsgw:8025
otp_validity_seconds = 300
upload_dir = /var/sewasetu/uploads

[admin]
; Departmental login name. The password is never stored in the repository:
; set ADMIN_PASSWORD (or ADMIN_PASSWORD_HASH) in the environment.
username = swd-admin

[pension]
min_age = 60
sla_days = 15
scheme_deadline = 2026-10-31 23:59
