{% extends "base.html" %}
{% from "_progress.html" import progress %}
{% block content %}
{{ progress(3) }}
<h2>Address Details</h2>
<form method="post">
  <label for="village">Village / Town</label>
  <input type="text" id="village" name="village" maxlength="100"
         value="{{ data.get('village','') }}">
  <label for="block">Block</label>
  <select id="block" name="block">
    <option value="">--Select--</option>
    {% for b in blocks %}
    <option {% if data.get('block')==b %}selected{% endif %}>{{ b }}</option>
    {% endfor %}
  </select>
  <p><button class="btn" type="submit">Save &amp; Continue</button>
     <a class="btn secondary" href="/form/1">Back</a></p>
</form>
{% endblock %}
