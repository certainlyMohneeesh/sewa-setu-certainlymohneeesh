services:
  db:
    image: postgres:15
    # 4 app workers x pool of 20 + the nightly job + headroom; the default is 100
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: sewasetu
      POSTGRES_USER: sewasetu
      # secrets come from the untracked .env file; create it with scripts/gen-env.sh
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?missing - run: sh scripts/gen-env.sh}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      # TCP on purpose: during first-boot initialisation the temporary server only
      # listens on the unix socket, so this turns healthy only once the seed is loaded
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sewasetu -d sewasetu"]
      interval: 5s
      timeout: 5s
      retries: 60

  app:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      SEWASETU_DB_PASSWORD: "${POSTGRES_PASSWORD:?missing - run: sh scripts/gen-env.sh}"
      SECRET_KEY: "${SECRET_KEY:?missing - run: sh scripts/gen-env.sh}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-swd-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?missing - run: sh scripts/gen-env.sh}"
    depends_on:
      db:
        condition: service_healthy
      smsgw:
        condition: service_started
    volumes:
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu

  scheduler:
    build: ./app
    command: ["sh", "/app/deploy/scheduler-entrypoint.sh"]
    environment:
      SEWASETU_DB_PASSWORD: "${POSTGRES_PASSWORD:?missing - run: sh scripts/gen-env.sh}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - applogs:/var/log/sewasetu

  smsgw:
    build: ./smsgw
    # internal only — reached by the app over the docker network and exposed to
    # users via the app at /__gateway/ (so no second host port is needed)
    expose:
      - "8025"

volumes:
  pgdata:
  uploads:
  applogs:
